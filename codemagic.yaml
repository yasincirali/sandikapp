workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_app_store_key
    environment:
      vars:
        APP_STORE_APPLE_ID: $APP_STORE_APPLE_ID
        BUNDLE_ID: com.sandik.app
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      groups:
        - sandik_secrets
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Decode GoogleService-Info.plist
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > $CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: |
          keychain initialize
          # Use persistent private key from env var (CERT_PRIVATE_KEY, base64-encoded PEM)
          # If not set, generate ephemeral key (only works on first build after cert revoke)
          if [ -n "$CERT_PRIVATE_KEY" ]; then
            echo "$CERT_PRIVATE_KEY" | base64 --decode > /tmp/cert_key
          else
            ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key -q -N ""
            echo "=== Add this to CERT_PRIVATE_KEY env var (base64) ==="
            base64 -i /tmp/cert_key
            echo "=== End of key ==="
          fi
          # Delete existing App Store profiles so a fresh one is created with
          # current App ID capabilities (Push Notifications was recently enabled).
          # fetch-signing-files --create reuses existing profiles, which don't
          # pick up newly-added capabilities on the App ID.
          app-store-connect profiles list \
            --type IOS_APP_STORE \
            --json 2>/dev/null | \
            jq -r '.[] | .id' | \
            while read -r PROFILE_ID; do
              echo "Deleting profile $PROFILE_ID"
              app-store-connect profiles delete "$PROFILE_ID" --ignore-not-found || true
            done

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR
          # get-latest-build-number checks all builds (TestFlight + App Store +
          # processing/invalid), avoiding "value already used" errors when the
          # TestFlight-only counter is stale (e.g. after a rejected upload).
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" || echo "0")
          BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          echo "Using build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
      - name: Build Flutter iOS without codesign
        script: |
          flutter build ios --release --no-codesign \
            --build-number=$BUILD_NUMBER \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      - name: Xcode archive and export IPA
        script: |
          cd $CM_BUILD_DIR
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups: []
        submit_to_app_store: false
