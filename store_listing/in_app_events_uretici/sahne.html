<!doctype html>
<!--
  App Store In-App Event görselleri — sade 2B SVG (2026-10-19, 2. tur).
  1. tur Three.js 3B sahneydi; yasin: "parlak kısımlarda sorun var, 3B olma
  gereksinimi de yok". Parlama/bloom/toz kaldırıldı; düz, keskin vektör.

  Kararlar (karar 6.2 / 6.3, 2026-09-30'dan devralındı):
  * METİNSİZ: App Store etkinlik adını ve kısa açıklamayı görselin üstüne
    kendisi yazar; görseldeki yazı onunla çakışır ve dil başına ayrı görsel
    ister. Kart (16:9) alt üçte biri, detay (9:16) alt yarısı sakin bırakılır.
  * Palet sandık kimliği (lib/theme/sandik.dart): koyu yeşil zemin, kazanç
    yeşili sütunlar, TEK amber odak.
  * Uydurma sayı yok: enflasyon sahnesi TÜİK verisi (AYLIK), yıl sonu sahnesi
    kişiye özel olduğundan VERİ İMA ETMEZ (12 eşit dilimli yıl halkası).
  * Hedef sahnesi (Ocak "2027 hedefini koy", 2026-11-10): hedef kişiye
    özel, tutar ve oran İMA EDİLMEZ. Eşit adımlı ince yol + yolun sonunda
    tek amber hedef halkası; dolu kısım yalnız "yol" fikri, eksen/ölçek yok.
-->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0B211C}svg{display:block}</style>
</head><body>
<script>
const q = new URLSearchParams(location.search);
const W = +q.get('w'), H = +q.get('h'), SAHNE = q.get('s');
const dikey = H > W;

// GERÇEK VERİ (kullanıcı kuralı "uydurma sayı yasak"; yasin 2026-10-19
// "tarih ve data doğru olmalı"): TÜİK aylık TÜFE, Kasım 2025 – Ekim 2026.
// Zincir çarpımı %29,76 ≈ TÜİK yıllık %29,77 (Ekim 2026, açıklama 3 Kasım);
// son 10 ay %27,51 ≈ TÜİK yılbaşından beri %27,52. Aralık etkinliği
// (yayın 19 Kasım) bu diziyle çizilir. Yeni ay açıklanınca (ayın 3'ü)
// diziye ekle, en eskisini çıkar, yeniden üret.
// Geçmiş: Eylül 2026 dizisi Ekim 2025 (%2,55) ile başlıyordu, zincir %29,72.
const AYLIK = [0.87, 0.89, 4.84, 2.96, 1.94, 4.18, 1.71, 0.99, 1.78, 1.84, 1.84, 2.58];

const ZEMIN_UST = '#07171300', ZEMIN = '#0B211C', ZEMIN_ALT = '#143A2D';
const KAZANC = '#3DB77F', KAZANC_KOYU = '#1E6B4C', AMBER = '#F5A623', ALTIN = '#F5C842';
const SOLUK = 'rgba(214,240,226,0.78)';

const parca = [];
const p = s => parca.push(s);

p(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`);
p(`<defs>
  <linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0A1F1A"/><stop offset="0.55" stop-color="${ZEMIN}"/><stop offset="1" stop-color="${ZEMIN_ALT}"/>
  </linearGradient>
  <linearGradient id="sutun" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${KAZANC}"/><stop offset="1" stop-color="${KAZANC_KOYU}"/>
  </linearGradient>
  <linearGradient id="altin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${ALTIN}"/><stop offset="1" stop-color="${AMBER}"/>
  </linearGradient>
</defs>`);
p(`<rect width="${W}" height="${H}" fill="url(#zemin)"/>`);

// Motif kutusu: kart → üst %62 (alt üçte bir metne), detay → %22–%60 bandı.
const kutu = dikey
  ? { x0: W * .09, x1: W * .91, y0: H * .22, y1: H * .60 }
  : { x0: W * .10, x1: W * .90, y0: H * .10, y1: H * .62 };

if (SAHNE === 'enf') {
  // Kartta App Store önizlemesi sağ üst köşeye koyu bir yuvarlak koyuyor
  // (yasin'in ASC ekranı, 2026-11-12): yolun ucu onun altında kalıyordu.
  // Kartta motif sağdan ve üstten içeri çekilir; detay aynı kalır.
  if (!dikey) Object.assign(kutu, { x1: W * .80, y0: H * .22 });
  // 3. tur (yasin 2026-11-12, "odaktan ilerleyelim"; eski sahne 12 eşit
  // ağırlıklı sütun + bekleyen ay yuvasıydı, "daha ilgi çekici" istendi).
  // Soluk sütunlar = aylık TÜFE, kesikli çizgi = birikimli TÜFE (ikisi de
  // GERÇEK veri, AYLIK). Kalın amber yol = "enflasyonun üstünde kalan
  // birikim": TEMSİLÎ, bir varlığın getirisi değil; eksen/ölçek/rakam yok,
  // yalnız TÜFE çizgisinin üstünde giderek açılan sabit bir pay. Aradaki
  // hafif amber alan korunan fark. Tek amber odak yolun ucundaki nokta.
  const N = AYLIK.length, gen = kutu.x1 - kutu.x0, yuk = kutu.y1 - kutu.y0, taban = kutu.y1;
  const adim = gen / N, sg = adim * .5, olc = yuk * .5 / Math.max(...AYLIK);
  const cx = i => kutu.x0 + adim * (i + .5);
  for (let i = 0; i < N; i++) { const h = AYLIK[i] * olc; p(`<rect x="${cx(i) - sg / 2}" y="${taban - h}" width="${sg}" height="${h}" rx="${sg * .2}" fill="url(#sutun)" opacity=".28"/>`); }
  let b = 1; const t = [[kutu.x0, taban]];
  for (let i = 0; i < N; i++) { b *= 1 + AYLIK[i] / 100; t.push([cx(i), taban - (b - 1) * 100 / 29.8 * yuk * .62]); }
  const yol = a => a.map((n, i) => (i ? 'L' : 'M') + n[0].toFixed(1) + ' ' + n[1].toFixed(1)).join(' ');
  const a = t.map(([x, y], i) => [x, y - yuk * .05 - (i / N) * yuk * .26]);
  // Aradaki alan: kazanılan fark, çok hafif amber.
  p(`<path d="${yol(a)} ${yol(t.slice().reverse()).replace('M', 'L')} Z" fill="${AMBER}" fill-opacity=".10"/>`);
  p(`<path d="${yol(t)}" fill="none" stroke="${SOLUK}" stroke-width="${Math.max(3, W * .0024)}" stroke-dasharray="${W * .008} ${W * .006}" stroke-linecap="round"/>`);
  p(`<path d="${yol(a)}" fill="none" stroke="url(#altin)" stroke-width="${Math.max(6, W * .0065)}" stroke-linejoin="round" stroke-linecap="round"/>`);
  const [ex, ey] = a[a.length - 1];
  p(`<circle cx="${ex}" cy="${ey}" r="${W * (dikey ? .022 : .011)}" fill="${ALTIN}"/>`);
  p(`<circle cx="${ex}" cy="${ey}" r="${W * (dikey ? .04 : .02)}" fill="none" stroke="${AMBER}" stroke-opacity=".45" stroke-width="${Math.max(2, W * .0014)}"/>`);
} else if (SAHNE === 'hedef') {
  // Hedef: soldan sağa eşit aralıklı yol noktaları (yılın 12 ayı), ilk
  // yarısı kazanç yeşili, kalanı soluk; yolun sonunda amber hedef halkası.
  // Noktalar eşit büyüklükte: büyüme ya da tutar ima etmez.
  const my = dikey ? (kutu.y0 + kutu.y1) / 2 : kutu.y0 + (kutu.y1 - kutu.y0) * .55;
  const gen = kutu.x1 - kutu.x0;
  const R = Math.min(gen, kutu.y1 - kutu.y0) * (dikey ? .11 : .20);
  const hedefX = kutu.x1 - R; // halka kutunun içinde kalır (dikeyde taşıyordu)
  const N = 12, bas = kutu.x0 + gen * .04, son = hedefX - R * 1.5;
  const adim = (son - bas) / (N - 1);
  const kal = Math.max(3, W * .0026);
  const yari = Math.floor(N / 2);
  p(`<line x1="${bas}" y1="${my}" x2="${hedefX - R}" y2="${my}" stroke="rgba(214,240,226,0.22)" stroke-width="${kal}" stroke-linecap="round"/>`);
  p(`<line x1="${bas}" y1="${my}" x2="${bas + adim * (yari - 1)}" y2="${my}" stroke="${KAZANC}" stroke-width="${kal * 1.6}" stroke-linecap="round"/>`);
  const r = Math.max(5, adim * .14);
  for (let i = 0; i < N; i++) {
    const dolu = i < yari;
    p(`<circle cx="${bas + adim * i}" cy="${my}" r="${r}" fill="${dolu ? KAZANC : 'none'}" stroke="${dolu ? KAZANC : SOLUK}" stroke-opacity="${dolu ? 1 : .5}" stroke-width="${Math.max(2, W * .0014)}"/>`);
  }
  // Hedef: dış ince halka, iç dolu amber; tek odak, parlamasız.
  p(`<circle cx="${hedefX}" cy="${my}" r="${R}" fill="none" stroke="${AMBER}" stroke-opacity=".45" stroke-width="${Math.max(2, W * .0016)}"/>`);
  p(`<circle cx="${hedefX}" cy="${my}" r="${R * .62}" fill="none" stroke="${AMBER}" stroke-opacity=".75" stroke-width="${Math.max(2, W * .0018)}"/>`);
  p(`<circle cx="${hedefX}" cy="${my}" r="${R * .3}" fill="url(#altin)"/>`);
} else {
  // Yıl sonu: 12 eşit dilimli halka (yılın ayları), Aralık altın ve halkadan
  // hafifçe dışarı taşmış; merkezde tek amber nokta. Veri ima etmez.
  const mx = (kutu.x0 + kutu.x1) / 2, my = (kutu.y0 + kutu.y1) / 2;
  const R = Math.min(kutu.x1 - kutu.x0, kutu.y1 - kutu.y0) * .46;
  const kal = R * .30, bosluk = 2.2; // derece
  const yay = (a0, a1, rr) => {
    const rad = a => (a - 90) * Math.PI / 180;
    const x0 = mx + rr * Math.cos(rad(a0)), y0 = my + rr * Math.sin(rad(a0));
    const x1 = mx + rr * Math.cos(rad(a1)), y1 = my + rr * Math.sin(rad(a1));
    return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${rr} ${rr} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  };
  for (let i = 0; i < 12; i++) {
    const a0 = i * 30 + bosluk / 2, a1 = (i + 1) * 30 - bosluk / 2;
    const aralik = i === 11;
    const rr = aralik ? R + kal * .22 : R;
    const op = aralik ? 1 : (.38 + .5 * (i / 11));
    p(`<path d="${yay(a0, a1, rr)}" fill="none" stroke="${aralik ? ALTIN : KAZANC}" stroke-opacity="${op.toFixed(2)}" stroke-width="${aralik ? kal * 1.2 : kal}" stroke-linecap="butt"/>`);
  }
  // İç ince halka + merkez nokta: tamamlanan döngü.
  p(`<circle cx="${mx}" cy="${my}" r="${R - kal * .95}" fill="none" stroke="rgba(214,240,226,0.22)" stroke-width="${Math.max(2, W * .0012)}"/>`);
  p(`<circle cx="${mx}" cy="${my}" r="${kal * .42}" fill="url(#altin)"/>`);
}

p('</svg>');
document.body.insertAdjacentHTML('beforeend', parca.join('\n'));
window.HAZIR = true;
</script></body></html>
