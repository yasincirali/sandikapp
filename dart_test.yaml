# Test etiketleri — tek kaynak.
#
# `gorsel`: hiçbir şey assert ETMEYEN, yalnızca `build/gorsel/` altına PNG
# döken önizleme üreteçleri (`cubuk_gorsel_onizleme_test.dart`). Bu makinedeki
# emülatörler Flutter'ı render edemediği için "doğru görünüyor mu" sorusunu
# yanıtlamanın tek yolu bunlar (bkz. CLAUDE.md, yerel makine notları).
#
# **Neden varsayılanda KAPALI:** üreteç her karede tam bir sahne rasterize
# ediyor ve 10 dakikalık test zaman aşımını aşıyor — yani açık bırakılırsa
# CI'ı ve `tool/deploy_emulators.sh`'ı ASILI BIRAKIP kırar. Testin kendi
# başlığı "CI'da koşmasın diye `gorsel` etiketi taşıyor" diyordu ama etiket
# hiçbir yerde tanımlı değildi; bu dosya o eksiği kapatıyor.
#
# Elle koşmak için:  flutter test --tags gorsel
tags:
  gorsel:
    # Yalnızca açıkça istendiğinde koşar.
    skip: "görsel önizleme üreteci — elle koş: flutter test --tags gorsel"
  # `golden`: `matchesGoldenFile` ile assert EDEN görsel testler
  # (`test/goldens/`). PNG'ler rasterizer'a ve font hinting'ine duyarlı —
  # Windows'ta üretilen görüntü CI'ın Linux'unda tutmaz, testi sahte kırar.
  # Bu yüzden `gorsel` gibi varsayılanda kapalı; görsel değişiklikte elle:
  #   flutter test --run-skipped --update-goldens test/goldens/
  golden:
    skip: "golden — platforma duyarlı, elle koş: flutter test --run-skipped test/goldens/"
