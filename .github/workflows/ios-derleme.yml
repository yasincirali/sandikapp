name: iOS derleme kontrolü

# iOS (Swift: widget uzantısı, Live Activity) yalnız main'e birleşince
# ios-testflight.yml'de derleniyordu; kırık Swift o zaman tüm TestFlight
# hattını durduruyordu. Bulut oturumlarında Xcode yok, Swift'i PR'da
# derleyen tek yer bu iş. İmzasız simülatör derlemesi: secret/sertifika
# gerekmez (yalnız GoogleService-Info.plist, Runner kaynağı olduğu için).

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-derleme.yml'
  workflow_dispatch:

concurrency:
  group: ios-derleme-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  derle:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # ios-testflight.yml ile aynı sabit sürüm.
          flutter-version: 3.47.2
          cache: true

      - name: Set up Ruby (cocoapods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Flutter dependencies
        run: flutter pub get

      - name: Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: CocoaPods install
        working-directory: ios
        run: |
          bundle install
          bundle exec pod install

      # Runner + gömülü uzantılar (SandikWidget) birlikte derlenir.
      - name: Flutter iOS simülatör derlemesi
        run: flutter build ios --simulator --debug
