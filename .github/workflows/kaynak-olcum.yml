# ABD hissesi / eurobond fiyat kaynaklarının erişim ve hız ölçümü (2026-10-08).
#
# Neden: bulut geliştirme kabı finans hostlarını reddediyor; karşılaştırma
# gerçek bir sunucudan yapılmalı. Salt okunur, anahtarsız, secret kullanmaz
# (public repo: log herkese açık). Sonuç tablosu iş özetinde.
name: Kaynak ölçümü (ABD / eurobond)

on:
  workflow_dispatch:
  push:
    branches: [claude/eurobond-abd-borsasi-oe2amo]
    paths:
      - tool/kaynak_olcum.py
      - tool/kaynak_ornek.py
      - tool/eurobond_canli.ts
      - supabase/functions/_shared/eurobond.ts
      - .github/workflows/kaynak-olcum.yml

permissions:
  contents: read

jobs:
  olcum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Eurobond ayrıştırıcıları canlı kaynakta
        run: deno run --allow-net tool/eurobond_canli.ts
