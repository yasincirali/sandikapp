# ABD hissesi / eurobond fiyat kaynaklarının erişim ve hız ölçümü (2026-10-08).
#
# Neden: bulut geliştirme kabı finans hostlarını reddediyor; karşılaştırma
# gerçek bir sunucudan yapılmalı. Salt okunur, anahtarsız, secret kullanmaz
# (public repo: log herkese açık). Sonuç tablosu iş özetinde.
name: Kaynak ölçümü (ABD / eurobond)

# Yalnız elle: kaynak biçimi değiştiğinde ayrıştırıcıyı canlı yanıtla dener.
# Ölçüm dalında push'ta da koşuyordu; main'de her push'ta dış hostlara
# gitmesi gereksiz.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-cwtgkn]
    paths: [tool/mevduat_kaynak_olcum.py, .github/workflows/kaynak-olcum.yml]

permissions:
  contents: read

jobs:
  olcum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Eurobond ayrıştırıcıları canlı kaynakta
        if: ${{ !startsWith(github.ref_name, 'claude/project-thread-cwtgkn') }}
        run: deno run --allow-net tool/eurobond_canli.ts
      - name: Mevduat banka/faiz kaynakları
        if: ${{ startsWith(github.ref_name, 'claude/project-thread-cwtgkn') }}
        run: |
          pip install -q pandas openpyxl xlrd pypdf
          python tool/mevduat_kaynak_olcum.py
