# App Store In-App Event taslakları (karar 6.5, 2026-09-30).
#
# Elle tetiklenir. Varsayılan KURU koşu: yalnız ne kurulacağını yazar.
# "uygula" işaretlenirse etkinlikleri App Store Connect'te TASLAK kurar —
# incelemeye GÖNDERMEZ; o adım kullanıcı taslağı gördükten sonra ASC'de.
# Kaynak: store_listing/ios/in_app_events/etkinlikler.json (+ PNG'ler).
# Kimlik: TestFlight iş akışıyla aynı ASC_* secret'ları.
name: App Store etkinlikleri (taslak)

on:
  workflow_dispatch:
    inputs:
      uygula:
        description: "Taslakları gerçekten kur (işaretsiz = kuru koşu)"
        type: boolean
        default: false

jobs:
  etkinlikler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyjwt cryptography requests
      # Görseller commit'li DEĞİL (.gitignore store_listing/ios/**/*.png);
      # kaynak 3B sahneden her koşuda üretilir ki JSON ile görsel adları hep
      # eşleşsin (2026-10-19: 2B Pillow çizimi → Three.js sahnesi).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Görselleri üret (Three.js + başsız Chromium)
        working-directory: store_listing/in_app_events_uretici
        run: |
          npm install --no-audit --no-fund
          npx -y playwright@1.56.0 install chromium
          node cek.mjs
      - name: Etkinlikleri kur
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          if [ "${{ inputs.uygula }}" = "true" ]; then
            python tool/asc_in_app_events.py --uygula
          else
            python tool/asc_in_app_events.py
          fi
