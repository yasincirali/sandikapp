name: iOS — TestFlight

# Her main push'ta çalışır. Flutter iOS release build + fastlane match
# (readonly) + gym + pilot ile TestFlight'a upload eder.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'legal/**'
      - 'store_listing/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_upload:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # macos-latest bazen Xcode 26.x beta yükler; Firebase/plugin pod'lar
      # bazı beta SDK'larda derleme sorunu çıkarır. Stable 16.x'e sabitle.
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Ruby (fastlane + cocoapods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Flutter dependencies
        run: flutter pub get

      - name: Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: CocoaPods install
        working-directory: ios
        run: |
          bundle install
          bundle exec pod install

      - name: Flutter iOS release build (no codesign — fastlane resigns)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Fastlane beta (match + gym + TestFlight)
        working-directory: ios
        # Job limitinden (60 dk) kısa: codesign etkileşimli parola istemiyle
        # asılırsa 35 dk'da bu adım düşer, log'lar ve artefaktlar yüklenir.
        # Aksi halde job iptal edilir ve sonraki adımlar hiç çalışmaz.
        timeout-minutes: 35
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTH }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: "true"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: bundle exec fastlane beta

      - name: Upload IPA artifact (debug reference)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandik-ios-ipa
          path: ios/build/sandik.ipa
          if-no-files-found: warn
          retention-days: 14
