name: iOS — TestFlight

# Her main push'ta çalışır. Flutter iOS release build + fastlane match
# (readonly) + gym + pilot ile TestFlight'a upload eder.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'legal/**'
      - 'store_listing/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

# Fastlane sürümü otomatik yükselttiğinde workflow bunu depoya geri
# yazıyor (aşağıdaki "Commit auto version bump" adımı) — bunun için
# yazma izni gerekir. Varsayılan token salt okunur olabilir.
permissions:
  contents: write

jobs:
  build_and_upload:
    runs-on: macos-latest
    # 90: harici gruba otomatik gönderimde build'in işlenmesi beklenir
    # (genelde 15–30 dk) — derleme + bekleme 60'ı aşabilir.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # macos-latest bazen Xcode 26.x beta yükler; Firebase/plugin pod'lar
      # bazı beta SDK'larda derleme sorunu çıkarır. Stable 16.x'e sabitle.
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # SÜRÜM SABİT. `channel: stable` tek başına sürüm sabitlemez: stable
          # ilerledikçe yeni deprecation'lar birikir ve `flutter analyze` bir
          # gün kendiliğinden kırılır — bu bir kez yaşandı (activeColor,
          # withOpacity). Yükseltme bilinçli bir karar olmalı.
          flutter-version: 3.47.2
          cache: true

      - name: Set up Ruby (fastlane + cocoapods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Flutter dependencies
        run: flutter pub get

      - name: Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: CocoaPods install
        working-directory: ios
        run: |
          bundle install
          bundle exec pod install

      - name: Flutter iOS release build (no codesign — fastlane resigns)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Köprü sürümü (K1): Frankfurt. Secret yoksa boş kalır → tek sunuculu
          # derleme, Remote Config `sunucu` bayrağı etkisiz (build kırılmaz).
          SUPABASE_URL_EU: ${{ secrets.SUPABASE_URL_EU }}
          SUPABASE_ANON_KEY_EU: ${{ secrets.SUPABASE_ANON_KEY_EU }}
          # Sosyal giriş kimlikleri (YAPMAN_GEREKENLER #16). Secret girilmemişse
          # define boş kalır: Google düğmesi görünmez, build kırılmaz.
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=SUPABASE_URL_EU=$SUPABASE_URL_EU \
            --dart-define=SUPABASE_ANON_KEY_EU=$SUPABASE_ANON_KEY_EU \
            --dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID \
            --dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID

      - name: Fastlane beta (match + gym + TestFlight)
        working-directory: ios
        # Job limitinden (60 dk) kısa: codesign etkileşimli parola istemiyle
        # asılırsa 35 dk'da bu adım düşer, log'lar ve artefaktlar yüklenir.
        # Aksi halde job iptal edilir ve sonraki adımlar hiç çalışmaz.
        timeout-minutes: 35
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTH }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: "true"
          FASTLANE_HIDE_CHANGELOG: "1"
          # `xcodebuild -showBuildSettings` için fastlane'in varsayılanı
          # 3 saniye taban + 4 deneme. Soğuk bir runner'da Flutter + ~40
          # CocoaPods hedefi taşıyan workspace bu sürede ayarlarını
          # döndüremiyor ve `build_app` daha ARCHIVE'a başlamadan düşüyor:
          #
          #   [!] xcodebuild -showBuildSettings timed out after 4 retries
          #       with a base timeout of 3
          #
          # (run 33906688791, build_app 105 sn'de patladı; bir önceki
          # çalıştırmada aynı adım 268 sn sürüp BAŞARILI olmuştu — yani
          # sınır runner'ın o anki hızına göre gelip gidiyor.)
          #
          # Değişkenlerin adını fastlane'in kendi hata mesajı veriyor.
          # Yükseltmek yalnızca BEKLEME tavanını büyütür: ayarlar erken
          # dönerse beklenmez, yani hızlı çalıştırmalar yavaşlamaz.
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
        run: bundle exec fastlane beta

      # Fastlane, sürüm TestFlight'a kapalıysa pubspec.yaml'daki patch'i
      # otomatik yükseltiyor (bkz. Fastfile `next_open_version`). Bu değişiklik
      # runner'da kalırsa kaybolur ve bir sonraki push aynı kapalı sürümle
      # gelip yeniden bump gerektirirdi. Depoya geri yazıyoruz ki yereldeki
      # sürüm ile TestFlight'taki sürüm ayrışmasın.
      - name: Commit auto version bump
        if: success()
        run: |
          if git diff --quiet -- pubspec.yaml; then
            echo "Sürüm değişmedi — commit gerekmiyor."
            exit 0
          fi
          NEW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): sürümü otomatik yükselt -> ${NEW_VERSION} [skip ci]"
          # Bu adım sırasında main ilerlemiş olabilir; rebase ile üstüne bin.
          #
          # `--autostash` ŞART: derleme çalışma ağacında başka dosyalar da
          # bırakıyor (`ios/Flutter/Generated.xcconfig`, imza ayarlarıyla
          # değişen `project.pbxproj`, `Podfile.lock`…). Onlar commit'e
          # girmiyor ama rebase "unstaged changes" diye REDDEDİYOR:
          #
          #   error: cannot pull with rebase: You have unstaged changes.
          #
          # Run #205'te upload başarılıydı, build TestFlight'a gitti ve
          # workflow SADECE bu satırda kırıldı — sürüm bump'ı depoya
          # yazılamadı, CI kırmızı göründü. (2026-09-17)
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # Harici (external) TestFlight grubu — yasin'in kararı (2026-10-01):
      # her main birleşmesi harici testçilere de gitsin, Android kapalı
      # testle aynı anda. Repo değişkeni TESTFLIGHT_HARICI_GRUP boşsa adım
      # atlanır ve eski davranış (yalnız dahili) birebir sürer. Build ASC'de
      # işlenene dek beklenir; yükleme ve sürüm bump'ı bu adımdan ÖNCE
      # bittiği için burada bir hata yalnız harici gönderimi etkiler.
      - name: TestFlight — harici gruba gönder
        if: success() && vars.TESTFLIGHT_HARICI_GRUP != '' && env.TF_BUILD_NUMBER != ''
        working-directory: ios
        timeout-minutes: 50
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          FASTLANE_HIDE_CHANGELOG: "1"
          GRUPLAR: ${{ vars.TESTFLIGHT_HARICI_GRUP }}
          NOTLAR: ${{ vars.TESTFLIGHT_HARICI_NOT }}
        run: |
          bundle exec fastlane harici_dagit \
            groups:"$GRUPLAR" \
            build_number:"$TF_BUILD_NUMBER" \
            changelog:"$NOTLAR" \
            bekle:true

      - name: Upload IPA artifact (debug reference)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandik-ios-ipa
          path: ios/build/sandik.ipa
          if-no-files-found: warn
          retention-days: 14
