name: Integration (yerel Supabase + emülatör)

# Yol haritası 3.16 — uçtan uca duman testi.
#
# Neden ayrı bir workflow: ci.yml hızlı kapı (analyze + birim testleri,
# ~10 dk). Buradaki iş Docker'da tam Supabase yığını + Android emülatörü
# ister (~25 dk); ci.yml'e eklenmesi her PR'ı o kadar bekletirdi.
#
# İki katman, bilerek sıralı:
#   1. supabase-smoke  — `supabase start` (0000 + tüm migration'lar + seed),
#      sonra tool/supabase_smoke.sh: Flutter'sız, düz REST ile giriş → varlık
#      ekle → oku → RLS reddi. Saniyeler sürer; kırmızıysa sorun sunucu
#      tarafında ve emülatörü hiç açmaya gerek yok.
#   2. emulator-smoke  — aynı yığın + Android emülatörü +
#      integration_test/smoke_test.dart (gerçek uygulama).
#
# Hosted bir "test Supabase projesi" YOK; yığın koşucuda ayağa kalkar ve
# işle birlikte ölür. Secret gerekmez: yerel anon key deterministik ve
# `supabase status` ile okunur.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-smoke:
    name: Supabase yığını + başsız duman
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 0000_base_schema.sql'den 00xx'e kadar her migration + seed.sql.
      # Bir migration taze yığında kırılırsa burada, PR'da görünür —
      # canlı projeye `db push` edilmeden.
      - name: supabase start
        run: supabase start

      - name: Başsız duman (REST)
        run: bash tool/supabase_smoke.sh

      - name: supabase stop
        if: always()
        run: supabase stop --no-backup

  emulator-smoke:
    name: Android emülatörü + integration_test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: supabase-smoke
    steps:
      - uses: actions/checkout@v4

      # GitHub'ın Linux koşucularında KVM var ama /dev/kvm varsayılan olarak
      # yalnızca root'a açık; emülatör donanım hızlandırmasız çalışmaz.
      - name: KVM izni
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # ci.yml / android-release.yml ile AYNI sürüm.
          flutter-version: 3.47.2
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Runner saatini yığından ÖNCE eşitle (2026-09-21): NTP düzeltmesi
      # koşunun ortasında saati geri çekerse GoTrue'nun verdiği JWT
      # PostgREST'e göre "gelecekten" gelir (PGRST303) ve giriş düşer.
      # Best-effort: araç yoksa sessizce geç; asıl güvence test döngüsü.
      - name: Saat eşitle
        run: |
          sudo chronyc -a makestep >/dev/null 2>&1 || sudo timedatectl set-ntp true >/dev/null 2>&1 || true
          date -u

      - name: supabase start
        run: supabase start

      # Emülatör ana makineye 10.0.2.2 üzerinden ulaşır; anon key yerel
      # yığının sabit anahtarı (gizli değil).
      - name: Supabase bağlantı bilgisi
        run: |
          eval "$(supabase status -o env | grep -E '^ANON_KEY=')"
          echo "SUPABASE_URL=http://10.0.2.2:54321" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: integration_test (emülatör)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # TEK SATIR — ters eğik çizgiyle satır devamı BURADA ÇALIŞMAZ.
          #
          # `android-emulator-runner` bu `script` bloğunu satır satır ayrı
          # `sh -c` çağrılarıyla koşuyor (CI logunda görülüyor: her satır
          # kendi `[command]/usr/bin/sh -c ...` satırını basıyor). Bir kabuk
          # devam satırı (`\`) bu yüzden hiç birleşmiyor: komut ters eğik
          # çizgide bitiyor, `--dart-define` satırları hiç geçmiyor ve
          # Flutter argüman olarak bir ters eğik çizgi görüyor. Onu bir
          # test YOLU sanınca toplanan dosya kümesi
          # `<cwd>/integration_test` önekinin dışına çıkıyor ve
          # `_shouldRunAsIntegrationTests` (flutter_tools/src/commands/
          # test.dart) şu hatayı atıyor:
          #
          #   Integration tests and unit tests cannot be run in a single
          #   invocation.
          #
          # Mesaj sebebi hiç göstermediği için beş hipotez ölçülerek
          # elendi (2026-09-15): dizin/dosya yazımı, eğik çizgi, fazladan
          # `_test.dart` (CI'da listelendi — tek dosya, symlink yok),
          # cihazın görünmemesi (`flutter devices` onu listeliyordu) ve
          # `-d` eksikliği. `pwd` de repo kökünü doğruladı.
          #
          # Bu adım workflow yazıldığından beri kırıktı ama GÖRÜLMEDİ:
          # `supabase start` 0054'ün Vault denetiminde hep önce kırıldığı
          # için buraya hiç ulaşılamıyordu.
          # İKİ DENEME (2026-09-21). Aynı gün iki kez şu flake görüldü:
          # giriş `PGRST303 "JWT issued at future"` ile düştü, yeniden koşuda
          # geçti. Sebep runner saati: NTP düzeltmesi saati GERİ çekince
          # GoTrue'nun az önce verdiği JWT PostgREST'e göre gelecekten
          # geliyor. Kodla ilgisi yok; aşağıdaki saat eşitleme adımı riski
          # azaltır, bu döngü kalanını yakalar. İkinci deneme de düşerse
          # gerçek hata — kırmızı kalır.
          # ⚠️ TEK SATIR: emulator-runner `script:` satırlarını ayrı ayrı
          # `sh -c` ile koşturur; döngü/if buraya yazılamaz (2026-09-21'de
          # "Syntax error: end of file unexpected" ile kırıldı). Mantık
          # `tool/integration_test_retry.sh`'ta.
          script: bash "$GITHUB_WORKSPACE/tool/integration_test_retry.sh" emulator-5554

      - name: supabase stop
        if: always()
        run: supabase stop --no-backup
