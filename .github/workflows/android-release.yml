name: Android — Release AAB

# Play Console'a yüklenecek AAB'yi üretir.
#
# Neden APK değil AAB: `flutter build apk` üç ABI'yi de tek dosyada taşır
# (ölçüldü: 64,3 MB). AAB'de Play cihaz başına ayırır ve kullanıcı yalnızca
# kendi ABI'sini indirir — arm64'te ~11,9 MB. Debug sembolleri de teslim
# edilmez.
#
# Tetik: main'e push (belge değişikliği hariç), `v*` tag'i ya da elle.
# Eskiden yalnız elle/tag idi ("her main push'unda imzalı sürüm üretmenin
# anlamı yok") — o karar Play'de uygulama yokken verilmişti. 2026-09-28:
# kapalı test başladı, iOS her main push'unda TestFlight'a gidiyor; Android
# testçileri aynı kodu aynı anda almalı. versionCode artık her koşuda arttığı
# için (100 + koşu no) sık derleme Play'de çakışma üretmez.
#
# ⚠️ Artefakt 30 gün sonra siliniyor. Yayınlanan HER sürümün `symbols/`
# klasörünü indirip arşivle — Dart karartması açık olduğu için o sürümün
# çökme kayıtları başka türlü çözülemez.

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Yan yükleme için ABI-bölünmüş APK de üret'
        type: boolean
        default: false
      play_durumu:
        description: "Play'e yükleme durumu: completed = incelemeye gider, draft = Console'da elle gönderilir"
        type: choice
        options: [completed, draft]
        default: completed
  # iOS (ios-testflight.yml) ile AYNI tetik (2026-09-28, kullanıcı isteği:
  # "android için de otomatik build olsun"). Belge değişikliği build istemez.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'legal/**'
      - 'store_listing/**'
      - 'tool/tasima/**'
      - '**/*.md'
    tags:
      - 'v*'

# cancel-in-progress KAPALI (2026-10-10). Açıkken her yeni main push'u
# koşan derlemeyi iptal ediyordu; Android koşusu tam test paketi + AAB ile
# ~20 dk sürdüğü için (iOS ~birkaç dk, test koşmaz) arka arkaya birleşmelerde
# Android hiç bitemiyordu: 10 Ekim'de #155/#156/#157 ve #161 koşuları iptal
# oldu, TestFlight giderken kapalı teste build çıkmadı. Kapalıyken koşan
# derleme biter; bekleyen tek bir koşu kalır (GitHub aradakileri yenisiyle
# değiştirir), yani kuyruk birikmez ve her zaman en güncel main de gider.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Play'e otomatik yükleme YALNIZ servis hesabı tanımlıysa. Secret yokken
      # adım atlanır, iş yeşil biter — AAB yine artefakt olarak iner.
      # Kurulum: PLAY_STORE_YAYIN_REHBERI.md §8.4.
      PLAY_YUKLE: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # SÜRÜM SABİT. `channel: stable` tek başına sürüm sabitlemez: stable
          # ilerledikçe yeni deprecation'lar birikir ve `flutter analyze` bir
          # gün kendiliğinden kırılır — bu bir kez yaşandı (activeColor,
          # withOpacity). Yükseltme bilinçli bir karar olmalı.
          flutter-version: 3.47.2
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      # google-services.json repoda tutulmaz; secret'tan yazılır.
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret'ı tanımlı değil"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      # build.gradle.kts key.properties'i okur; yoksa debug key'e düşer ve
      # Play böyle bir AAB'yi reddeder → burada varlığını zorunlu kılıyoruz.
      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret'ı tanımlı değil — imzasız AAB Play tarafından reddedilir"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Analyze
        run: flutter analyze lib/ test/

      - name: Test
        run: flutter test

      # --obfuscate Dart sembol adlarını karartır; --split-debug-info onları
      # ayrı dosyaya yazar. İkisi birlikte zorunlu. Karartma olmadan APK'dan
      # sınıf/metot adları düz metin okunabiliyor (docs/archive/PRODUCTION_STATUS.md S5).
      # Sonuç: Crashlytics'e düşen Dart stack trace'leri okunamaz hale gelir —
      # aşağıdaki symbols artefaktını sürüm bazında SAKLA:
      #   flutter symbolize -i crash.txt -d symbols/app.android-arm64.symbols
      - name: Build AAB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Köprü sürümü (K1): Frankfurt. Secret yoksa boş kalır → tek sunuculu
          # derleme, Remote Config `sunucu` bayrağı etkisiz (build kırılmaz).
          SUPABASE_URL_EU: ${{ secrets.SUPABASE_URL_EU }}
          SUPABASE_ANON_KEY_EU: ${{ secrets.SUPABASE_ANON_KEY_EU }}
          # Sosyal giriş kimlikleri (YAPMAN_GEREKENLER #16). Secret girilmemişse
          # define boş kalır: Google düğmesi görünmez, build kırılmaz.
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          # RevenueCat public SDK anahtarı (paywall). Secret yoksa define boş
          # kalır: satın alma "kullanılamıyor" der, build kırılmaz.
          REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
        # --build-number: versionCode her koşuda ARTMALI. Eskiden pubspec'in +N'si
        # (7) kullanılıyordu; ikinci AAB Play'de "sürüm kodu kullanıldı" diye
        # reddedilirdi (2026-09-27 fark edildi, ilk yükleme 7). 100 + koşu no:
        # 7'nin üstünden başlar, tekdüze artar; iOS'u etkilemez (fastlane ayrı
        # sayar). Zorunlu güncelleme kapısı `min_build_android` bu sayıyla karşılaştırır.
        run: |
          flutter build appbundle --release \
            --build-number=$((100 + GITHUB_RUN_NUMBER)) \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=SUPABASE_URL_EU=$SUPABASE_URL_EU \
            --dart-define=SUPABASE_ANON_KEY_EU=$SUPABASE_ANON_KEY_EU \
            --dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID \
            --dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID \
            --dart-define=REVENUECAT_ANDROID_KEY=$REVENUECAT_ANDROID_KEY

      # Yan yükleme / doğrudan dağıtım için. --split-per-abi olmadan üretilen
      # APK üç ABI'yi birden taşır ve gereksiz büyük olur.
      - name: Build split APKs
        if: inputs.build_apk
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Köprü sürümü (K1): Frankfurt. Secret yoksa boş kalır → tek sunuculu
          # derleme, Remote Config `sunucu` bayrağı etkisiz (build kırılmaz).
          SUPABASE_URL_EU: ${{ secrets.SUPABASE_URL_EU }}
          SUPABASE_ANON_KEY_EU: ${{ secrets.SUPABASE_ANON_KEY_EU }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          # RevenueCat public SDK anahtarı (paywall). Secret yoksa define boş
          # kalır: satın alma "kullanılamıyor" der, build kırılmaz.
          REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=$((100 + GITHUB_RUN_NUMBER)) \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=SUPABASE_URL_EU=$SUPABASE_URL_EU \
            --dart-define=SUPABASE_ANON_KEY_EU=$SUPABASE_ANON_KEY_EU \
            --dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID \
            --dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID \
            --dart-define=REVENUECAT_ANDROID_KEY=$REVENUECAT_ANDROID_KEY

      # Play'e yüklenen AAB'nin sembolleri strip'lenmiş olur; crash'lerin
      # okunabilir kalması için sembolleri ayrıca sakla.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          retention-days: 30
          if-no-files-found: error
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/mapping/release/mapping.txt
            build/symbols/**

      # Kapalı test (Alpha) kanalına yükleme — TestFlight'ın Android karşılığı.
      # `completed`: yönetilen yayınlama kapalıyken doğrudan incelemeye gider,
      # onaylanınca testçiler güncellemeyi alır. versionCode her koşuda artar
      # (100 + koşu no), Play aynı kodu reddetmez. İlk AAB elle yüklendi
      # (2026-09-27) — Play API ilk yüklemeyi kabul etmiyordu, artık gerek yok.
      - name: Play Console — Kapalı test (Alpha)
        if: env.PLAY_YUKLE == '1'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sandik.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: alpha
          status: ${{ github.event.inputs.play_durumu || 'completed' }}
          mappingFile: build/app/outputs/mapping/release/mapping.txt

      - name: Boyut özeti
        run: |
          {
            echo "### Android release çıktısı"
            echo ""
            echo "| Dosya | Boyut |"
            echo "|---|---|"
            find build/app/outputs -name '*.aab' -o -name '*.apk' | while read -r f; do
              printf "| %s | %s |\n" "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo ""
            echo "AAB boyutu teslim edilen boyut DEĞİLDİR — Play cihaz başına"
            echo "ayırır ve sembolleri strip'ler. arm64 indirmesi ~12 MB."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keystore temizle
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
