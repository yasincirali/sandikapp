# Supabase migration + Edge Function dağıtımı.
#
# Neden bir workflow: Claude Code web ortamının Supabase API'sine ağ erişimi
# yok ve CLI/kimlik bilgisi taşımıyor; migration'lar "senin elinden" geçmek
# zorunda kalıyordu. Secret'lar bir kez GitHub'a girilince dağıtım buradan
# tetiklenir (Actions sekmesi → Run workflow, ya da Claude'un actions API'si).
#
# Otomatik tetik BİLİNÇLİ olarak yok: `main`'e her push'ta canlı şemaya
# dokunmak istemiyoruz; migration'ı ne zaman koşacağına sen karar verirsin.
#
# **TEK SUNUCU: FRANKFURT (yasin 2026-11-06, "Tokyo'yu kapatalım").**
# 2026-09-28'den geçişe kadar kural "iki sunucu birebir"di: varsayılan hedef
# `ikisi`, sıra Frankfurt → Tokyo, sonda `esitlik` parmak izi kapısı. Geçiş
# 18 Ekim'de bitti; Tokyo o geceden beri donmuş (cron'lar ve Data API kapalı),
# verisi bayat olduğu için geri dönüş/yedek değeri de kalmadı ve duraklatılıp
# silinecek. Duraklatılmış bir projeye deploy kırmızı döneceği için varsayılan
# Frankfurt; `ikisi`, `esitlik` işi ve tek seferlik `frankfurt_esitle` işi
# kaldırıldı. `tokyo` seçeneği yalnız Tokyo silinmeden geri açılırsa diye
# duruyor (silinince bu seçenek ve `SUPABASE_DB_PASSWORD` de kalkar).
#
# Gerekli secret'lar (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase.com → Account → Access Tokens. _EU yoksa
#                            Frankfurt'u gören hesaptan.
#   SUPABASE_ACCESS_TOKEN_EU — isteğe bağlı: Frankfurt'u gören hesabın token'ı.
#                            İki proje ayrı hesaptaysa şart (2026-10-01'de ortak
#                            token Frankfurt'ta 403 aldı); yoksa ortağa düşülür.
#   SUPABASE_DB_PASSWORD   — yalnız Tokyo, isteğe bağlı: güncel CLI şifre
#                            yerine token'la geçici giriş rolü kurar
# Proje ref'leri secret DEĞİL (uygulamada zaten açık, supabase_config.dart);
# aşağıdaki matriste yazılı. `SUPABASE_PROJECT_REF` artık okunmuyor.
name: Supabase deploy

on:
  workflow_dispatch:
    inputs:
      hedef:
        description: "Hangi sunucu: frankfurt (canlı, varsayılan) ya da tokyo (yalnız silinmeden geri açılırsa)"
        type: choice
        options: [frankfurt, tokyo]
        default: frankfurt
      migrations:
        description: "supabase db push (migration'ları koş)"
        type: boolean
        default: true
      functions:
        description: "Deploy edilecek fonksiyonlar: 'all', 'none' ya da boşlukla ayrılmış liste"
        type: string
        default: all
      dry_run:
        description: "Yalnızca plan (db push --dry-run, fonksiyon deploy atlanır)"
        type: boolean
        default: false
      repair:
        description: "Deftere 'uygulandı' işaretlenecek sürümler (SQL Editor'dan elle koşulanlar için; SQL KOŞMAZ)"
        type: string
        default: ""
      unrepair:
        description: "Deftere 'reverted' işaretlenecek sürümler — db push onları YENİDEN koşar (yanlış repair'i geri alır)"
        type: string
        default: ""
      include_all:
        description: "Defterde 'uygulandı' görünse bile TÜM migration'ları koş (yanlış repair'i telafi eder)"
        type: boolean
        default: false
      secrets_list:
        description: "Function secret ADLARINI listele (değer değil) — 'X secret'ı girildi mi?' sorusu için"
        type: boolean
        default: false
      karsilastir:
        description: "Taşıma öncesi parmak izi: fonksiyon kod özetleri + Auth ayarları (değer değil, özet). Yazmaz"
        type: boolean
        default: false
      sql:
        description: "Salt okunur rapor sorgusu (Management API, read_only, tek ifade). Kişisel veri/Vault değeri döndüren sorgu reddedilir — log herkese açık"
        type: string
        default: ""

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (${{ matrix.hedef }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Tek hedef. Matris adı (`deploy (frankfurt)`) ve `matrix.hedef`'e bağlı
      # adımlar değişmesin diye tek elemanlı matris olarak kaldı.
      matrix:
        hedef: ${{ fromJSON(format('["{0}"]', inputs.hedef)) }}
    env:
      # Frankfurt başka bir Supabase hesabında olabilir (2026-10-01: ortak
      # token Frankfurt'ta 403 aldı). `_EU` tanımlıysa Frankfurt onu kullanır,
      # değilse ortak token'a düşer — secret eklenene kadar davranış aynı.
      SUPABASE_ACCESS_TOKEN: ${{ matrix.hedef == 'frankfurt' && secrets.SUPABASE_ACCESS_TOKEN_EU || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ matrix.hedef == 'tokyo' && secrets.SUPABASE_DB_PASSWORD || '' }}
      PROJECT_REF: ${{ matrix.hedef == 'tokyo' && 'ybdbzouzhzwthjgwlbmk' || 'ynwymnpdiwudrlxfrmuo' }}
    steps:
      - uses: actions/checkout@v4

      - name: Secret kontrolü (fail-fast, sessiz atlama yok)
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN secret'ı eksik"; exit 1; fi

      # 0076'dan beri cron tetikleyicileri edge function adresini Vault'taki
      # `project_url`'den okur. Yoksa migration yalnız UYARI verir ve o
      # projedeki bütün cron'lar sessizce durur — push öncesi kapı.
      - name: Vault project_url var mı (ad kontrolü, değer okunmaz)
        if: ${{ inputs.migrations }}
        run: |
          body=$(jq -n '{query: "select count(*)::int as n from vault.secrets where name = '"'"'project_url'"'"'"}')
          kod=$(curl -sS -o yanit.json -w '%{http_code}' -X POST \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
                -d "$body")
          # Erişim hatası "project_url yok" diye raporlanmamalı (2026-09-28:
          # token Frankfurt'a 403 alınca kapı yanlış teşhis yazdı).
          # Başarı 2xx'tir, yalnız 200 değil: API 2026-10-01'de bu uç için
          # 201 dönmeye başladı ve kapı başarılı yanıtı ([{"n":1}]) hata saydı.
          case "$kod" in
            2??) ;;
            *)
              echo "::error::${{ matrix.hedef }}: Management API HTTP $kod — token bu projeye erişemiyor olabilir. Yanıt: $(head -c 300 yanit.json)"
              exit 1 ;;
          esac
          n=$(jq -r '.[0].n' yanit.json)
          if [ "$n" != "1" ]; then
            echo "::error::${{ matrix.hedef }}: Vault'ta project_url yok. SQL Editor: select vault.create_secret('https://$PROJECT_REF.supabase.co', 'project_url');"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          # Sabit: `latest` her koşuda GitHub API'sinden çözülür ve paylaşımlı
          # runner IP'sinde rate limit'e takılıyordu (run 37079068456).
          # Yükseltme elle; integration.yml + supabase-deploy.yml birlikte.
          version: 2.119.0

      - name: Projeye bağlan
        run: supabase link --project-ref "$PROJECT_REF"

      # Defter onarımı — SQL KOŞMAZ, yalnızca `supabase_migrations` tablosuna
      # "bu sürüm uygulandı" kaydı düşer.
      #
      # Neden gerekli: SQL Editor'dan ELLE koşulan migration deftere yazılmaz;
      # CLI onu "uygulanmamış" görür ve her `db push` aynı dosyaları yeniden
      # koşmaya çalışır. İdempotent yazıldıkları için genelde zararsızdır ama
      # veri dokunan migration'ları (0058 tip düşürme, 0059 uygunluk kuralı)
      # gereksiz yere tekrar koşturmak istemiyoruz.
      #
      # Onarım `db push`'tan ÖNCE koşar: defter düzelsin, push yalnızca
      # gerçekten eksik olanı uygulasın.
      - name: Migration defterini onar
        if: ${{ inputs.repair != '' }}
        run: supabase migration repair --status applied ${{ inputs.repair }}

      # Defter kaydını GERİ AL — `db push` o sürümleri yeniden koşsun.
      #
      # `--include-all` bunun yerine GEÇMEZ: o yalnızca defterde HİÇ
      # bulunmayan sürümleri kapsar, "uygulandı" işaretli olanı atlamaya
      # devam eder (2026-09-14'te denendi, "up to date" dedi). Yanlışlıkla
      # `applied` işaretlenmiş ama gövdesi hiç çalışmamış bir migration'ı
      # ancak bu geri getirir.
      - name: Migration defterini geri al (yeniden koşsun)
        if: ${{ inputs.unrepair != '' }}
        run: supabase migration repair --status reverted ${{ inputs.unrepair }}

      # `--include-all`: defter "uygulandı" dese bile hepsini koşar.
      #
      # Neden gerekiyor: `migration repair` deftere kayıt düşer ama SQL
      # KOŞMAZ. 2026-09-14'te 0050–0060 yanlışlıkla bu şekilde işaretlendi;
      # 0054'ün gövdesi hiç çalışmadığı hâlde `db push` onu atlar oldu ve
      # yedi cron tetikleyicisi ölü kaldı. Migration'lar idempotent
      # yazıldığı için yeniden koşmaları güvenlidir.
      - name: Migration'lar (plan)
        if: ${{ inputs.migrations }}
        run: |
          supabase db push --dry-run ${{ inputs.include_all && '--include-all' || '' }}

      - name: Migration'lar (uygula)
        if: ${{ inputs.migrations && !inputs.dry_run }}
        run: |
          supabase db push ${{ inputs.include_all && '--include-all' || '' }}

      # Secret adları — "girildi mi?" sorusu için. Değer basılmaz (CLI zaten
      # yalnızca ad + özet gösterir). Vault tarafı için `sql` girdisini kullan:
      # `select name from vault.secrets` — adlar; `decrypted_secrets` ASLA.
      - name: Function secret adları
        if: ${{ inputs.secrets_list }}
        run: supabase secrets list --project-ref "$PROJECT_REF"

      # Salt okunur rapor — Management API'nin query ucu access token ile
      # çalışır, DB şifresi/pooler adresi gerektirmez. Çıktı Actions log'una
      # düşer: gizli değer döndüren sorgu yazma.
      #
      # 2026-10-20 incelemesi: "salt okunur" yalnız açıklamada yazıyordu;
      # sorgu sahip yetkisiyle gidiyor, bir `delete`/`update` yazım hatası
      # canlı veriyi değiştirebiliyordu ve repo herkese açık olduğu için
      # kişisel veri (e-posta, telefon) dünyaya açık log'a düşebiliyordu.
      # Üç kapı: (1) API'nin `read_only` bayrağı — sunucu yazmayı reddeder;
      # (2) tek ifade — `;` ile ikinci ifade eklenemez (sondaki `;` serbest);
      # (3) kişisel veri kolonu adı geçen sorgu çalışmaz — sayım için
      # `count(*)` yeterli, kolonun kendisine gerek yok.
      - name: SQL raporu
        if: ${{ inputs.sql != '' }}
        env:
          SQL: ${{ inputs.sql }}
        run: |
          sorgu=$(printf '%s' "$SQL" | sed -e 's/[[:space:]]*;[[:space:]]*$//')
          if printf '%s' "$sorgu" | grep -q ';'; then
            echo "::error::Tek ifade çalışır; ';' ile ikinci ifade eklenemez."; exit 1
          fi
          if printf '%s' "$sorgu" | grep -Eiq '\b(email|phone|raw_user_meta_data|raw_app_meta_data|decrypted_secrets?|encrypted_password)\b'; then
            echo "::error::Kişisel veri/gizli kolon adı geçen sorgu herkese açık log'a yazılmaz."; exit 1
          fi
          body=$(jq -n --arg q "$sorgu" '{query: $q, read_only: true}')
          curl -sS -f -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body" | jq .

      # Taşıma (docs/SUPABASE_FRANKFURT_TASIMA.md) öncesi "iki sunucu aynı
      # mı?" sorusunun şemanın dışında kalan iki yarısı: dağıtılmış fonksiyon
      # KODU ve Auth ayarları. Şema parmak izi (eski `esitlik` işi) bunları görmezdi.
      # Repo herkese açık, log da açık: hiçbir DEĞER basılmaz. Fonksiyonda
      # Supabase'in paket özeti (ezbr_sha256), Auth'ta her alanın sha256'sının
      # ilk 12 hanesi — iki iş arasında satır satır karşılaştırılır.
      # Mantıksal alanlar (sağlayıcı açık/kapalı) zaten sır değil, açık yazılır.
      - name: Taşıma parmak izi (fonksiyon kodu + Auth ayarı, değersiz)
        if: ${{ inputs.karsilastir }}
        run: |
          api="https://api.supabase.com/v1/projects/$PROJECT_REF"
          h="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          {
          curl -sS -f "$api/functions" -H "$h" \
            | jq -r 'sort_by(.slug)[] | "fonksiyon \(.slug) | \(.status) | jwt=\(.verify_jwt) | \((.ezbr_sha256 // "-")[0:16])"'
          curl -sS -f "$api/config/auth" -H "$h" \
            | jq -r 'to_entries | sort_by(.key)[]
                | select(.value != null and .value != "")
                | if (.value|type) == "boolean" then "\(.key) = \(.value)"
                  else "\(.key) = #\(.value|tojson)" end' \
            | while IFS= read -r satir; do
                case "$satir" in
                  *" = #"*) k=${satir%% = #*}; v=${satir#* = #}
                            printf '%s = %s\n' "$k" "$(printf '%s' "$v" | sha256sum | cut -c1-12)" ;;
                  *) printf '%s\n' "$satir" ;;
                esac
              done | sed 's/^/auth /'
          } > "parmak_${{ matrix.hedef }}.txt"
          cat "parmak_${{ matrix.hedef }}.txt"

      - name: Taşıma parmak izini sakla
        if: ${{ inputs.karsilastir }}
        uses: actions/upload-artifact@v4
        with:
          name: parmak-${{ matrix.hedef }}
          path: parmak_${{ matrix.hedef }}.txt
          retention-days: 3

      - name: Edge Function'lar
        if: ${{ inputs.functions != 'none' && !inputs.dry_run }}
        run: |
          if [ "${{ inputs.functions }}" = "all" ]; then
            list=$(ls -d supabase/functions/*/ | xargs -n1 basename | grep -v '^_shared$')
          else
            list="${{ inputs.functions }}"
          fi
          for f in $list; do
            echo "::group::deploy $f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
