name: portfoy_takip
description: sandık — kişisel portföy takibi (hisse, fon, döviz, altın)
version: 1.1.6+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.8.4
  http: ^1.2.1
  intl: ^0.20.2
  uuid: ^4.4.2
  fl_chart: ^0.68.0
  flutter_slidable: ^3.1.0
  shared_preferences: ^2.3.2
  share_plus: ^10.0.0
  flutter_local_notifications: ^18.0.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_svg: ^2.0.10+1
  crypto: ^3.0.3
  animated_toggle_switch: ^0.8.7
  path_provider: ^2.1.5
  firebase_crashlytics: ^5.2.1
  firebase_analytics: ^12.0.0
  firebase_remote_config: ^6.0.0
  url_launcher: ^6.3.1
  # Yenilikler ekranı: çalışan sürümü pubspec yerine PAKETTEN okur —
  # fastlane sürümü CIda bump ettiği için elle yazılan sabit bayatlıyordu
  # (Ayarlarda "sürüm 1.0.0" yazıyordu, gerçek 1.1.4).
  package_info_plus: ^8.0.0
  home_widget: ^0.9.3
  local_auth: ^3.0.2
  sign_in_with_apple: ^8.2.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^10.3.4
  app_links: ^7.2.1
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Duman testi (3.16): integration_test/smoke_test.dart — gerçek uygulama,
  # yerel Supabase yığını. CI: .github/workflows/integration.yml
  integration_test:
    sdk: flutter
  # Sahte zaman: `seri_cekim_kapisi_test` timeout davranışını 8 saniye
  # BEKLEMEDEN ölçüyor. `flutter_test` bunu zaten geçişli olarak getiriyor
  # ama doğrudan import edildiği için açıkça bildiriliyor
  # (`depend_on_referenced_packages`).
  fake_async: ^1.3.1
  # Build-time ikon üretici; runtime bağımlılığı değil (2026-09'da taşındı).
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  # bundled_font_test.dart pubspec'in font kaydını doğrudan okur
  yaml: ^3.1.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sandik_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  background_color_ios: "#FCD35A"
  # Adaptive icon (Android 8.0+) — masking için %66 safe zone'lu foreground
  adaptive_icon_background: "#0A1E15"
  adaptive_icon_foreground: "assets/images/sandik_icon_fg.png"
  # Themed icon (Android 13+) — system tint uygulanır
  adaptive_icon_monochrome: "assets/images/sandik_icon_mono.png"

flutter:
  uses-material-design: true
  # gen-l10n (3.20): lib/l10n/app_*.arb → lib/l10n/generated/ (bkz. l10n.yaml).
  generate: true

  assets:
    - assets/images/

  # DM Sans yerel asset olarak gömülü; tek marka fontu. Aile adı
  # `kSandikFontFamily` (lib/theme/sandik.dart) ile birebir aynı olmalı —
  # `bundled_font_test` bunu kilitler. google_fonts 2026-09-14'te kaldırıldı.
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/DMSans-Black.ttf
          weight: 900
