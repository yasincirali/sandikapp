name: portfoy_takip
description: sandık — kişisel portföy takibi (hisse, fon, döviz, altın)
version: 1.1.4+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.8.4
  http: ^1.2.1
  intl: ^0.20.2
  uuid: ^4.4.2
  fl_chart: ^0.68.0
  flutter_slidable: ^3.1.0
  shared_preferences: ^2.3.2
  share_plus: ^10.0.0
  google_fonts: ^6.2.1
  flutter_local_notifications: ^18.0.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_svg: ^2.0.10+1
  crypto: ^3.0.3
  animated_toggle_switch: ^0.8.7
  path_provider: ^2.1.5
  firebase_crashlytics: ^5.2.1
  firebase_analytics: ^12.0.0
  firebase_remote_config: ^6.0.0
  url_launcher: ^6.3.1
  home_widget: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # bundled_font_test.dart pubspec'in font kaydını doğrudan okur
  yaml: ^3.1.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sandik_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  background_color_ios: "#FCD35A"
  # Adaptive icon (Android 8.0+) — masking için %66 safe zone'lu foreground
  adaptive_icon_background: "#0A1E15"
  adaptive_icon_foreground: "assets/images/sandik_icon_fg.png"
  # Themed icon (Android 13+) — system tint uygulanır
  adaptive_icon_monochrome: "assets/images/sandik_icon_mono.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # DM Sans yerel asset olarak gömülü — google_fonts çalışma zamanında
  # fonts.gstatic.com'dan indirmesin diye (bkz. main.dart: allowRuntimeFetching).
  # Aile adı google_fonts'un ürettiğiyle birebir aynı olmalı ki paket
  # indirmek yerine gömülü olanı bulsun.
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/DMSans-Black.ttf
          weight: 900
