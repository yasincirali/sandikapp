name: portfoy_takip
description: iOS & Android portfolio tracker — PortfoyTakip
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.8.4
  http: ^1.2.1
  intl: ^0.19.0
  uuid: ^4.4.2
  fl_chart: ^0.68.0
  flutter_slidable: ^3.1.0
  shared_preferences: ^2.3.2
  share_plus: ^10.0.0
  google_fonts: ^6.2.1
  flutter_local_notifications: ^18.0.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_svg: ^2.0.10+1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sandik_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#FCD35A"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
