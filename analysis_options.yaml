# Analyzer ve lint yapılandırması.
#
# 2026-09-14: şablon dosya `flutter_lints` 6.x'e çekildi ve sıkılaştırıldı.
# Gerekçe (TECHNICAL_DEBT "analysis_options.yaml dokunulmamış şablon"):
# `strict-casts` örtük `dynamic` dönüşümlerini, `unawaited_futures`
# servis katmanındaki ateşle-unut çağrılarını yüzeye çıkarır — ikisi de
# sessiz hata kaynağı. Kapalı bırakılan bir kural varsa nedeni yanında.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Beklenmeyen future: ateşle-unut bilinçliyse `unawaited(...)` yazılır,
    # böylece niyet okunur.
    unawaited_futures: true
    # `avoid_dynamic_calls` AÇILMADI: 127 site, çoğu Supabase JSON satırı
    # (`row['x']`); tipli DTO'lar gelene kadar TECHNICAL_DEBT'te.
    # Boş `catch (_) {}` sessiz kalır; CLAUDE.md "servis catch'leri sessiz
    # kalmasın" kuralının analyzer karşılığı.
    empty_catches: true
    prefer_final_in_for_each: true
    prefer_final_locals: true
    unnecessary_await_in_return: true
    use_super_parameters: true
    require_trailing_commas: false
